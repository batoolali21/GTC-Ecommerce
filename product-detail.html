<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Details | GTC Tobacco Company</title>
	<link rel="stylesheet" href="STYLE2.css">
</head>
<body>

	<!-- Header & Navigation Bar -->
	<header class="header-nav">
		<div class="container navbar-inner">
			<a href="index.html" class="brand-logo-link">
				<img src="Hero image.jpeg" alt="GTC Logo" class="brand-logo-img">
				<div>
					<span class="brand-title">GTC</span>
					<span class="brand-subtitle">Golden Tobacco Company</span>
				</div>
			</a>

			<nav>
				<ul class="nav-links">
					<li><a href="index.html" class="nav-link">Home</a></li>
					<li><a href="products.html" class="nav-link active">Products</a></li>
					<li><a href="index.html#about" class="nav-link">About Owner</a></li>
					<li><a href="contact.html" class="nav-link">Contact Us</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<!-- Main Product Detail View Section -->
	<main class="container product-detail-container">
		<!-- Breadcrumb -->
		<div class="breadcrumb">
			<a href="index.html">Home</a> &gt; <a href="products.html">Products</a> &gt; <span id="breadcrumb-title">Product Details</span>
		</div>

		<!-- Product Detail Layout Card -->
		<div class="product-detail-layout" id="product-detail-card">
			<!-- Product detail media & info dynamically populated by JS -->
		</div>
	</main>

	<!-- Footer -->
	<footer>
		<div class="container">
			<p>&copy; 2026 Global Trading Center (GTC). All Rights Reserved.</p>
			<p>Address: Central Plaza, 41, Barkat Market, Garden Town, Lahore, Pakistan | Phone: 03164970924</p>
		</div>
	</footer>

	<!-- Realistic Floating WhatsApp Widget -->
	<a href="https://wa.me/923164970924?text=Hello%20GTC!%20I%20have%20an%20inquiry%20regarding%20your%20products." 
	   target="_blank" 
	   rel="noopener noreferrer" 
	   class="whatsapp-float" 
	   aria-label="Chat with us on WhatsApp">
		<span class="whatsapp-tooltip">Chat with us</span>
		<div class="whatsapp-icon-wrapper">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="whatsapp-svg">
				<path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
			</svg>
			<span class="whatsapp-badge"></span>
		</div>
	</a>

	<!-- Product Loader JavaScript -->
	<script src="products.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const urlParams = new URLSearchParams(window.location.search);
			const productId = parseInt(urlParams.get('id')) || 1;
			const product = window.productsData ? window.productsData.find(p => p.id === productId) : null;
			const detailCard = document.getElementById('product-detail-card');
			const breadcrumbTitle = document.getElementById('breadcrumb-title');

			if (!product || !detailCard) {
				detailCard.innerHTML = `
					<div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
						<h2 style="color: var(--accent-gold); margin-bottom: 15px;">Product Not Found</h2>
						<p style="color: var(--text-muted); margin-bottom: 20px;">The requested product could not be located in our catalog.</p>
						<a href="products.html" class="hero-cta-btn">Back to Products Catalog</a>
					</div>
				`;
				return;
			}

			// Update document title & breadcrumb
			document.title = `${product.name} | GTC Tobacco Company`;
			if (breadcrumbTitle) breadcrumbTitle.textContent = product.name;

			// Generate WhatsApp ordering link with product name & price
			const buyWhatsAppUrl = window.getWhatsAppBuyUrl(product);

			// Render product details & Buy Now button
			detailCard.innerHTML = `
				<div class="product-detail-media">
					<img src="${product.image}" alt="${product.name}" class="product-detail-img">
				</div>

				<div class="product-detail-info">
					<span class="product-detail-category">${product.category}</span>
					<h1 class="product-detail-name">${product.name}</h1>
					<div class="product-detail-price">${product.price}</div>
					<p class="product-detail-description">${product.description}</p>

					<div class="product-specs-list">
						<div class="product-specs-title">Product Specifications:</div>
						${product.specs.map(spec => `<div class="product-specs-item">${spec}</div>`).join('')}
					</div>

					<a href="${buyWhatsAppUrl}" target="_blank" rel="noopener noreferrer" class="buy-now-wa-btn">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
							<path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
						</svg>
						Buy Now via WhatsApp &rarr;
					</a>
				</div>
			`;
		});
	</script>

</body>
</html>
